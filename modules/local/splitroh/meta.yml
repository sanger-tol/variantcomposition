name: "splitroh"
description: split the output of bcftools roh into ST and RG lists respectively
keywords:
  - RoH
  - gawk
  - awk
  - file parsing
tools:
  - "splitroh":
      description: |
        "split the output of bcftools roh into two files containing ST and RG regions respectively"
  - "gawk":
      description: "GNU awk"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      tool_dev_url: "https://www.gnu.org/prep/ftp.html"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - roh:
        type: file
        description: Output of BCFtools_roh. Contains site-specific and/or
          per-region runs of homo/autozygosity calls.
        pattern: "*.roh"
        ontologies: []
output:
  roh_rg:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.roh.rg":
          type: file
          description: roh file with RG output
          pattern: "*.roh.rg"
          ontologies: []
  roh_st:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.roh.st":
          type: file
          description: roh file with ST output
          pattern: "*.roh.st"
          ontologies: []
  versions_gawk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gawk":
          type: string
          description: The name of the tool
      - "gawk --version":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - gawk --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@yz533cb"
maintainers:
  - "@yz533cb"
